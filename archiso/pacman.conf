#
# pacman.conf used during ISO build AND copied into the live system.
# Mirror of upstream Arch defaults plus Chaotic-AUR.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
Color
ILoveCandy
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Note: Chaotic-AUR is NOT enabled here at build time because its
# keyring/mirrorlist packages aren't installed yet. Instead,
# bratanos-firstboot.service runs /etc/bratanos/chaotic-aur-setup.sh on
# the first boot of the installed system, which imports the key, installs
# chaotic-{keyring,mirrorlist}, and appends a [chaotic-aur] section to
# /etc/pacman.conf. From then on, `pacman -S brave-bin` (and friends)
# Just Works.
