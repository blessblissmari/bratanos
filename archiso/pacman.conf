#
# pacman.conf used during ISO build AND copied into the live system.
# Mirror of upstream Arch defaults plus Chaotic-AUR.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
Color
ILoveCandy
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR — prebuilt binaries for popular AUR packages.
# Keys + mirrorlist are installed by /etc/bratanos/chaotic-aur-setup.sh on
# first boot. Until then, this section is harmless because the include
# below points at a file that may not yet exist; pacman warns but doesn't
# error. Once bratanos-first-boot.service runs, the include resolves.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
