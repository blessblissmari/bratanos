DEFAULT bratanos
PROMPT 0
TIMEOUT 30

UI vesamenu.c32
MENU TITLE BratanOS — Live ISO
MENU BACKGROUND splash.png
MENU COLOR title       1;36;44 #ffcdd6f4 #00000000 std
MENU COLOR sel         7;37;40 #ff1e1e2e #ff89b4fa all
MENU COLOR border      30;44   #ff45475a #00000000 std
MENU COLOR unsel       37;44   #ffcdd6f4 #00000000 std

LABEL bratanos
    MENU LABEL BratanOS (x86_64)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=512M

LABEL persistent
    MENU LABEL BratanOS (persistent — uses BRATAN_PERSIST partition)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_label=BRATAN_PERSIST cow_persistent=P

LABEL existing
    MENU LABEL Boot existing OS
    COM32 chain.c32
    APPEND hd0 0
