# Required for archiso live boot. Without this, mkinitcpio falls back to the
# default linux preset, which doesn't load the `archiso` hook — and the
# kernel can't mount /run/archiso/airootfs.sfs → kernel panic.
HOOKS=(base udev modconf block keyboard keymap consolefont archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs archiso_kms memdisk mdadm_udev encrypt)
