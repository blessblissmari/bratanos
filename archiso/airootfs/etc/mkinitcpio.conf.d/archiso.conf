# Required for archiso live boot. Without this, mkinitcpio falls back to the
# default linux preset, which doesn't load the `archiso` hook — and the
# kernel can't mount /run/archiso/airootfs.sfs → kernel panic.
#
# MODULES is *additive* (the archiso install hook also pulls in cdrom/loop/
# dm-snapshot/overlay). We force these modules so the initramfs can mount:
#   - iso9660  (boot ISO / DVD / dd-flashed USB)
#   - vfat     (USB stick's EFI partition)
#   - ext4     (BRATAN_PERSIST persistence overlay, generic linux disks)
#   - squashfs (the airootfs.sfs root image — without this, /dev/loop0
#               mount fails with 'unknown filesystem type squashfs' even
#               though the archiso hooks ran fine)
# Without these, mounting bootmnt or the squashfs root fails on real
# hardware where udev's auto-load timing is unfavourable.
MODULES=(squashfs iso9660 isofs vfat fat ext4)
HOOKS=(base udev modconf block keyboard keymap consolefont archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs archiso_kms memdisk mdadm_udev encrypt)
