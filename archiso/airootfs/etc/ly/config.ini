; /etc/ly/config.ini — BratanOS theming for the ly greeter.
;
; Reference: https://github.com/fairyglade/ly

animation = matrix
animate = true
asterisk = *
bg = 0
border_fg = 5
clear_password = true
clock = %F %T
cmatrix_fg = 2
console_dev = /dev/console
default_input = login
error_bg = 0
error_fg = 1
fg = 7
hide_borders = false
hide_f1_commands = false
input_len = 32
lang = en
load = true
margin_box_v = 1
margin_box_h = 2
max_desktop_len = 32
max_login_len = 32
max_password_len = 32
path = /usr/local/bin:/usr/bin:/bin
save = true
session_log = /var/log/ly-session.log
shutdown_cmd = /usr/bin/shutdown -h now
restart_cmd = /usr/bin/shutdown -r now
sleep_cmd = /usr/bin/systemctl suspend
service_name = ly
term_reset_cmd = /usr/bin/tput reset
tty = 2
xinitrc = ~/.xinitrc
xsessions = /usr/share/xsessions
wayland_specifier = (wayland)
x11_specifier = (x11)
;
; BratanOS branding header — drawn above the form.
; (Single string; ly renders it verbatim.)
;
; Replace with whatever ASCII you like in /etc/ly/header.txt — but ly
; reads the inline `box_title` only, so this is mostly cosmetic in the
; config; the header below is rendered by /etc/issue.
box_title = BratanOS
