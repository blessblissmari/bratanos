# /etc/bratanos/tidy.conf
#
# Defaults for bratan-tidy. Sourced as env vars by the systemd unit and
# pacman hooks. Edit and `systemctl daemon-reload`.

# Keep this many versions of every package in the pacman cache.
BRATAN_KEEP_CACHE=2

# Keep this many old kernels in addition to the running one.
BRATAN_KEEP_KERNELS=2

# Drop journal entries older than this many days.
BRATAN_JOURNAL_DAYS=14
