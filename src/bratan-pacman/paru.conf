#
# /etc/paru.conf — BratanOS defaults.
#
# Sensible newbie-friendly defaults so `pacman -S <aur-pkg>` (which the
# bratan-pacman wrapper forwards to paru) doesn't drown them in prompts.
#

[options]
BottomUp
SudoLoop
CleanAfter
NewsOnUpgrade
UpgradeMenu
CombinedUpgrade
RemoveMake
Pacman = /usr/bin/pacman

[bin]
FileManager = nvim
Sudo = sudo
